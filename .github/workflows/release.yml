# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Publish packages
        run: |
          pnpm --filter meteor-icons publish --access public --no-git-checks
          pnpm --filter @meteor-icons/react publish --access public --no-git-checks
          pnpm --filter @meteor-icons/preact publish --access public --no-git-checks
          pnpm --filter @meteor-icons/vue publish --access public --no-git-checks
          pnpm --filter @meteor-icons/solid publish --access public --no-git-checks
          pnpm --filter @meteor-icons/svelte publish --access public --no-git-checks
          pnpm --filter @meteor-icons/astro publish --access public --no-git-checks
          pnpm --filter @meteor-icons/hamlet publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
